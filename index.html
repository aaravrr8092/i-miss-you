<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Miss You</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f2027,#2c5364);
  font-family:Arial;
  color:white;
  text-align:center;
  overflow:hidden;
}
h1{
  font-size:3em;
  letter-spacing:2px;
  animation:glow 3s ease-in-out infinite;
}
@keyframes glow{
  0%{opacity:0.6;text-shadow:0 0 5px white;}
  50%{opacity:1;text-shadow:0 0 20px #ff9aa2;}
  100%{opacity:0.6;text-shadow:0 0 5px white;}
}
.heart{
  position:absolute;
  font-size:18px;
  animation:float 8s linear infinite;
  opacity:0.5;
}
@keyframes float{
  from{transform:translateY(110vh);}
  to{transform:translateY(-10vh);}
}
button{
  padding:12px 24px;
  font-size:16px;
  border:none;
  border-radius:30px;
  background:#ff9aa2;
  color:#000;
  cursor:pointer;
  margin-top:20px;
}
</style>
</head>

<body>
<div>
  <h1>I miss you ✨</h1>
  <button onclick="playMusic()">Tap to play music 🎵</button>
</div>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
function playMusic(){
  document.getElementById("music").play();
}
for(let i=0;i<25;i++){
  let h=document.createElement("div");
  h.innerHTML="♡";
  h.className="heart";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDelay=Math.random()*8+"s";
  document.body.appendChild(h);
}
</script>
</body>
</html>
